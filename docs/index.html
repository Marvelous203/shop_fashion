<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VELL — Create a Character</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glass: rgba(38, 36, 40, .30);
            --glass-2: rgba(255, 255, 255, .10);
            --line: rgba(255, 255, 255, .30);
            --line-strong: rgba(255, 255, 255, .75);
            --ink: #fff;
            --ink-2: rgba(255, 255, 255, .72);
            --ink-3: rgba(255, 255, 255, .5);
            --glow: 0 0 0 1px rgba(255, 255, 255, .85), 0 0 18px rgba(255, 255, 255, .35);
            --s: 1
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            background: #cfd2d4;
            overflow: hidden;
            color: #fff;
            font-family: Figtree, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased
        }

        button {
            background: none;
            border: 0;
            color: inherit;
            font: inherit;
            cursor: pointer
        }

        button:disabled {
            opacity: .4;
            cursor: default
        }

        svg.ic {
            width: 22px;
            height: 22px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .glass {
            position: absolute;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 22px;
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 18px 40px -18px rgba(0, 0, 0, .35)
        }

        .pill-on {
            box-shadow: var(--glow);
            background: rgba(255, 255, 255, .14)
        }

        /* scene */
        #scene {
            position: fixed;
            inset: 0;
            overflow: hidden
        }

        #grade {
            position: absolute;
            inset: -3%;
            transition: filter .9s ease
        }

        #bg {
            --bx: 0px;
            --by: 0px;
            position: absolute;
            inset: 0;
            background: center/cover no-repeat;
            transform: translate3d(var(--bx), var(--by), 0) scale(1.04);
            transition: transform .6s cubic-bezier(.2, .7, .2, 1)
        }

        #tint {
            position: absolute;
            inset: 0;
            mix-blend-mode: soft-light;
            transition: background .9s
        }

        #vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(20, 18, 22, .38) 100%), linear-gradient(180deg, rgba(20, 20, 24, .22), transparent 18%, transparent 70%, rgba(20, 20, 24, .35))
        }

        /* stage */
        #stage {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 1600px;
            height: 900px;
            transform: translate(-50%, -50%) scale(var(--s));
            transform-origin: 50% 50%
        }

        /* model */
        #modelWrap {
            position: absolute;
            left: 800px;
            top: 72px;
            width: 440px;
            height: 663px;
            margin-left: -220px;
            transform-origin: 50% 100%;
            transition: transform 1s cubic-bezier(.65, 0, .2, 1)
        }

        #modelWrap.mid {
            transform: translateY(345px) scale(1.5)
        }

        #modelWrap.portrait {
            transform: translateY(940px) scale(2.4)
        }

        #shadow {
            position: absolute;
            left: 50%;
            margin-left: -150px;
            bottom: -6px;
            width: 300px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(30, 28, 26, .55), rgba(30, 28, 26, 0));
            filter: blur(4px)
        }

        #modelInner {
            --mx: 0px;
            --build: 1;
            --height: 1;
            position: absolute;
            inset: 0;
            transform: translate3d(var(--mx), 0, 0) scaleX(var(--build)) scaleY(var(--height));
            transform-origin: 50% 100%;
            transition: transform .7s cubic-bezier(.2, .7, .2, 1)
        }

        #breath {
            position: absolute;
            inset: 0;
            transform-origin: 50% 100%;
            animation: breath 5.5s ease-in-out infinite
        }

        @keyframes breath {

            0%,
            100% {
                transform: scaleY(1)
            }

            50% {
                transform: scaleY(1.006)
            }
        }

        #figs {
            position: absolute;
            inset: 0
        }

        .fig {
            position: absolute;
            inset: 0;
            background: center bottom/contain no-repeat;
            filter: var(--real)
        }

        .fig.in {
            clip-path: inset(0 0 100% 0);
            animation: wipe 1.05s cubic-bezier(.7, 0, .25, 1) forwards
        }

        @keyframes wipe {
            from {
                clip-path: inset(0 0 100% 0)
            }

            to {
                clip-path: inset(0 0 0 0)
            }
        }

        #scan {
            position: absolute;
            left: -10%;
            right: -10%;
            top: 0;
            height: 2px;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, #fff 25%, #fff 75%, transparent);
            box-shadow: 0 0 22px 6px rgba(255, 255, 255, .55), 0 0 60px 18px rgba(214, 226, 255, .35)
        }

        #scan.go {
            animation: scan 1.05s cubic-bezier(.7, 0, .25, 1)
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 1
            }

            92% {
                opacity: 1
            }

            100% {
                top: 100%;
                opacity: 0
            }
        }

        #hotspots {
            position: absolute;
            inset: 0;
            transition: opacity .4s
        }

        #modelWrap:not(.full) #hotspots {
            opacity: 0;
            pointer-events: none
        }

        .hs {
            position: absolute;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .25);
            border: 1px solid #fff;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform .25s
        }

        .hs::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin: -3px;
            border-radius: 50%;
            background: #fff
        }

        .hs::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .8);
            animation: ping 2.4s infinite
        }

        @keyframes ping {
            0% {
                transform: scale(.6);
                opacity: 1
            }

            100% {
                transform: scale(1.6);
                opacity: 0
            }
        }

        .hs:hover {
            transform: scale(1.18)
        }

        .hs em {
            position: absolute;
            left: 34px;
            top: 50%;
            transform: translate(-6px, -50%);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            text-align: left;
            font-style: normal;
            font-size: 12px;
            line-height: 1.5;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(30, 30, 34, .55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: opacity .25s, transform .25s
        }

        .hs:hover em {
            opacity: 1;
            transform: translate(0, -50%)
        }

        .hs em u {
            text-decoration: none;
            font-weight: 600
        }

        /* top bar */
        #logo {
            position: absolute;
            left: 30px;
            top: 22px;
            display: flex;
            align-items: baseline;
            gap: 18px
        }

        #logo b {
            font-family: Syne, sans-serif;
            font-weight: 800;
            font-size: 46px;
            line-height: 1;
            letter-spacing: -.02em
        }

        #logo span {
            font-size: 15px;
            letter-spacing: .06em
        }

        #tabs {
            left: 410px;
            top: 22px;
            width: 720px;
            height: 54px;
            border-radius: 30px;
            padding: 4px;
            display: flex
        }

        #tabs button {
            position: relative;
            flex: 1;
            height: 44px;
            border-radius: 24px;
            font-size: 16px;
            letter-spacing: .05em;
            color: var(--ink-2);
            transition: color .3s
        }

        #tabs button.on {
            color: #fff
        }

        #tabInd,
        #sideInd {
            position: absolute;
            pointer-events: none
        }

        #tabInd {
            top: 5px;
            height: 44px;
            border-radius: 24px;
            left: 4px;
            width: 100px
        }

        body.ready #tabInd {
            transition: left .55s cubic-bezier(.7, 0, .2, 1), width .55s cubic-bezier(.7, 0, .2, 1)
        }

        #icons {
            position: absolute;
            right: 28px;
            top: 24px;
            display: flex;
            gap: 12px
        }

        .ib {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: grid;
            place-items: center
        }

        .ib.glass {
            position: relative
        }

        .ib.filled svg {
            fill: #fff
        }

        .bd {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background: #fff;
            color: #1b1a1d;
            font: 600 12px/20px Figtree, sans-serif;
            text-align: center;
            transform: scale(0);
            transition: transform .35s cubic-bezier(.3, 1.8, .5, 1);
            pointer-events: none
        }

        .bd.on {
            transform: scale(1)
        }

        .bd.bump {
            animation: bump .35s
        }

        @keyframes bump {
            40% {
                transform: scale(1.45)
            }
        }

        #more {
            left: 1362px;
            top: 84px;
            width: 210px;
            padding: 8px;
            transform-origin: top right;
            transform: scale(.9);
            opacity: 0;
            pointer-events: none;
            transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), opacity .25s;
            z-index: 30
        }

        #more.on {
            transform: none;
            opacity: 1;
            pointer-events: auto
        }

        #more button {
            display: block;
            width: 100%;
            text-align: left;
            height: 42px;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 15px
        }

        #more button:hover {
            background: var(--glass-2)
        }

        /* profile */
        #profile {
            left: 24px;
            top: 96px;
            width: 476px;
            height: 124px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 16px
        }

        #avatar {
            width: 98px;
            height: 98px;
            flex: none;
            border-radius: 18px;
            border: 1.5px solid rgba(255, 255, 255, .85);
            box-shadow: 0 0 16px rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .12) no-repeat
        }

        #pinfo {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0
        }

        .prow {
            display: flex;
            align-items: center;
            gap: 10px
        }

        #pname {
            font-size: 28px;
            font-weight: 400;
            line-height: 34px;
            white-space: nowrap;
            outline: 0;
            border-radius: 8px;
            padding: 0 4px;
            margin: 0 -4px
        }

        #pname.ed {
            box-shadow: 0 0 0 1px #fff;
            background: rgba(255, 255, 255, .14)
        }

        .rb {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            flex: none
        }

        .rb svg {
            width: 18px;
            height: 18px
        }

        #shuf {
            background: var(--glass-2);
            transition: transform .5s
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            color: var(--ink-2)
        }

        .meta i {
            width: 1px;
            height: 16px;
            background: var(--line)
        }

        .wx {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default
        }

        .wx svg {
            width: 20px;
            height: 20px
        }

        .wx::after {
            content: attr(data-tip);
            position: absolute;
            left: 0;
            top: 30px;
            white-space: nowrap;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(30, 30, 34, .65);
            backdrop-filter: blur(14px);
            opacity: 0;
            transform: translateY(-4px);
            transition: .25s;
            pointer-events: none;
            z-index: 5
        }

        .wx:hover::after {
            opacity: 1;
            transform: none
        }

        /* side + randomize */
        #side {
            left: 24px;
            top: 236px;
            width: 172px;
            height: 470px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: transform .6s cubic-bezier(.7, 0, .2, 1)
        }

        #side button {
            position: relative;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            font-size: 16px;
            color: var(--ink-2);
            text-align: left;
            transition: color .3s
        }

        #side button:hover,
        #side button.on {
            color: #fff
        }

        #sideInd {
            left: 9px;
            top: 10px;
            width: 152px;
            height: 54px;
            border-radius: 16px
        }

        body.ready #sideInd {
            transition: top .45s cubic-bezier(.7, 0, .2, 1)
        }

        #rand {
            left: 24px;
            top: 722px;
            width: 220px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
            transition: transform .6s cubic-bezier(.7, 0, .2, 1)
        }

        #rand svg {
            transition: transform .8s cubic-bezier(.3, .7, .3, 1)
        }

        body.nostyle #side {
            transform: translateX(-240px)
        }

        body.nostyle #rand {
            transform: translateX(-280px)
        }

        /* right panel */
        #panel {
            left: 1112px;
            top: 96px;
            width: 464px;
            height: 680px;
            overflow: hidden
        }

        .view {
            position: absolute;
            inset: 18px 14px 14px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            transition: transform .55s cubic-bezier(.7, 0, .2, 1), opacity .4s
        }

        .view::-webkit-scrollbar {
            display: none
        }

        .view.on {
            opacity: 1;
            transform: none;
            pointer-events: auto
        }

        .vh {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
            flex: none
        }

        .vh h3 {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: .06em;
            text-transform: uppercase;
            line-height: 20px
        }

        .vh span {
            font-size: 12px;
            color: var(--ink-3)
        }

        .lab {
            font-size: 13px;
            color: var(--ink-3);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin: 16px 0 8px
        }

        #chips {
            display: flex;
            justify-content: space-between;
            flex: none
        }

        .chip {
            width: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            line-height: 13px;
            color: var(--ink-2)
        }

        .chip.on {
            color: #fff
        }

        .ct {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--glass-2);
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            transition: box-shadow .3s
        }

        .chip.on .ct {
            box-shadow: var(--glow)
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            height: 296px;
            margin-top: 16px;
            flex: none;
            align-content: start
        }

        .card {
            position: relative;
            height: 142px;
            border-radius: 14px;
            border: 1px solid var(--line);
            overflow: hidden;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .06));
            transition: opacity .5s, transform .5s cubic-bezier(.2, .7, .2, 1), box-shadow .3s
        }

        .card .im {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20%;
            right: -20%;
            background: center top/auto 104% no-repeat;
            transition: transform .5s cubic-bezier(.2, .7, .2, 1)
        }

        .card:hover {
            transform: translateY(-3px)
        }

        .card:hover .im {
            transform: scale(1.06)
        }

        .card.on {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .85), 0 0 0 4px rgba(255, 255, 255, .25), 0 0 18px rgba(255, 255, 255, .35)
        }

        .card.roll {
            box-shadow: var(--glow);
            transform: scale(1.04)
        }

        .card.out {
            opacity: 0;
            transform: scale(.85);
            transition: opacity .3s, transform .3s
        }

        .card.pre {
            opacity: 0;
            transform: translateY(14px) scale(.96)
        }

        .card .nm {
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: 6px;
            font-size: 11px;
            text-align: center;
            padding: 4px 6px;
            border-radius: 999px;
            background: rgba(30, 30, 34, .55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transform: translateY(150%);
            opacity: 0;
            transition: transform .3s, opacity .3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card:hover .nm {
            transform: none;
            opacity: 1
        }

        .hb {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            display: grid;
            place-items: center;
            transform: scale(0);
            transition: transform .35s cubic-bezier(.3, 1.8, .5, 1)
        }

        .hb.on {
            transform: scale(1)
        }

        .hb svg {
            width: 14px;
            height: 14px;
            fill: #1b1a1d;
            stroke: none
        }

        #acc {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: none;
            padding-top: 8px
        }

        .row {
            border-radius: 12px;
            background: var(--glass-2);
            border: 1px solid var(--line)
        }

        .rh {
            display: flex;
            width: 100%;
            height: 38px;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .rh small {
            color: var(--ink-3);
            font-size: 13px
        }

        .rh svg {
            width: 18px;
            height: 18px;
            transition: transform .4s
        }

        .row.open .rh svg {
            transform: rotate(180deg)
        }

        .ab {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .4s cubic-bezier(.7, 0, .2, 1)
        }

        .row.open .ab {
            grid-template-rows: 1fr
        }

        .ab>div {
            overflow: hidden;
            min-height: 0
        }

        .it {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px 6px 14px;
            font-size: 14px
        }

        .it.none {
            color: var(--ink-3)
        }

        .it .in {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .it small {
            margin-left: 8px;
            color: var(--ink-3);
            font-size: 12px
        }

        .it b {
            font-weight: 600
        }

        .add {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            display: grid;
            place-items: center;
            flex: none;
            transition: background .25s, color .25s
        }

        .add svg {
            width: 15px;
            height: 15px
        }

        .add.on {
            background: #fff;
            color: #1b1a1d
        }

        /* tune / shared controls */
        .sws {
            display: flex;
            gap: 12px;
            margin: 6px 0 14px
        }

        .sw {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--line)
        }

        .sw.on {
            outline: 3px solid #fff;
            outline-offset: 2px
        }

        .opts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px
        }

        .opt {
            border-radius: 12px;
            padding: 9px 14px;
            font-size: 14px;
            background: var(--glass-2);
            border: 1px solid var(--line);
            transition: box-shadow .3s
        }

        .opt.on {
            box-shadow: var(--glow)
        }

        .sl {
            margin-top: 18px
        }

        .sr {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 4px
        }

        .sr b {
            font-weight: 600
        }

        input[type=range] {
            --p: 50%;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            outline: 0;
            cursor: pointer;
            display: block
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;

            /* ---- state ---- */
            const DEF = { look: 0, grade: 0, real: 75, height: 168, build: 50 };
            const S = { ...DEF };
            let hist = [{ ...S }], hi = 0, frame = 'full';
            const favs = new Set(), cart = new Map(), saved = [];
            let cat = 'all', openRow = null, tab = 'style', styleKey = 'outfits', winStart = 0, ident = 0, tok = 0, busy = false, editing = false, rot = 0, rotS = 0;

            /* ---- helpers ---- */
            const sp = r => r.style.setProperty('--p', ((r.value - r.min) / (r.max - r.min) * 100) + '%');
            function mkSlider(label, min, max, val, suffix, oninput, onchange) {
                const w = document.createElement('div'); w.className = 'sl';
                w.innerHTML = `<div class="sr"><span>${label}</span><b>${val}${suffix}</b></div><input type="range" min="${min}" max="${max}" value="${val}">`;
                const r = w.querySelector('input'), b = w.querySelector('b'); sp(r);
                r.addEventListener('input', () => { sp(r); b.textContent = r.value + suffix; oninput && oninput(+r.value) });
                r.addEventListener('change', () => onchange && onchange(+r.value));

                return w;
            }
            let tt; function toast(m) { const t = $('#toast'); t.querySelector('span').textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800) }
            function badge(id, n) { const b = $(id); const was = +b.dataset.n || 0; b.textContent = n; b.dataset.n = n; b.classList.toggle('on', n > 0); if (n !== was) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump') } }
            function rescan() { const s = $('#scan'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go') }
            function face(el, size) { const k = size / 360; el.style.backgroundImage = `url("${U1000[S.look]}")`; el.style.backgroundSize = `${1360 * k}px ${2048 * k}px`; el.style.backgroundPosition = `${-500 * k}px ${-46 * k}px`; el.style.backgroundRepeat = 'no-repeat' }

            /* ---- model ---- */
            function markCard(i) { $$('.card').forEach(c => c.classList.toggle('on', +c.dataset.i === i)) }
            async function showLook(i, instant) {
                const my = ++tok; markCard(i);
                try { await IMGS[i].decode() } catch (e) { }
                if (my !== tok) return;
                const figs = $('#figs'), fig = document.createElement('div');
                fig.className = 'fig' + (instant ? '' : ' in'); fig.style.backgroundImage = `url("${U1000[i]}")`; figs.appendChild(fig);
                if (instant) { while (figs.firstChild !== fig) figs.removeChild(figs.firstChild) }
                else { rescan(); fig.addEventListener('animationend', () => { while (figs.firstChild && figs.firstChild !== fig) figs.removeChild(figs.firstChild); fig.classList.remove('in') }, { once: true }) }
                renderAcc(); renderHot(); updateFaces(); updateFav();
            }
            function pickLook(i) { if (i === S.look) return; S.look = i; showLook(i); commit() }
            function updateFaces() { face($('#avatar'), 98); renderThumbs() }
            function setFrame(f) { frame = f; $('#modelWrap').className = f; $('#poseL').textContent = { full: 'Full', mid: 'Mid', portrait: 'Portrait' }[f]; $$('#fr .opt').forEach(o => o.classList.toggle('on', o.dataset.f === f)) }
            function applyGrade() { const g = FIL[S.grade]; $('#grade').style.filter = g.f; $('#tint').style.background = g.t; $('#ddn').textContent = g.n; $$('#ddl button').forEach((b, i) => b.classList.toggle('on', i === S.grade)); renderThumbs() }
            function applyReal() {
                const v = S.real, k = Math.max(0, (80 - v) / 80);
                $('#modelWrap').style.setProperty('--real', `saturate(${1 + k * .9}) contrast(${1 + k * .25}) blur(${k * 1.4}px) brightness(${1 + k * .05})`);
                $('#bg').style.filter = `blur(${k * 5}px) saturate(${1 + k * .5})`;
                const r = $('#realR'); r.value = v; sp(r); $('#realV').textContent = v + '%'
            }
            function applyBody() { const m = $('#modelInner'); m.style.setProperty('--height', 1 + (S.height - 168) / 168 * .9); m.style.setProperty('--build', 1 + (S.build - 50) / 50 * .07) }

            /* ---- history ---- */
            function btns() { $('#bUndo').disabled = hi <= 0; $('#bRedo').disabled = hi >= hist.length - 1 }
            function commit() { hist = hist.slice(0, hi + 1); hist.push({ ...S }); hi = hist.length - 1; btns() }
            function applySnap(sn) { const changed = sn.look !== S.look; Object.assign(S, sn); if (changed) showLook(S.look); applyGrade(); applyReal(); applyBody(); syncBody(); updateFav() }
            function undo() { if (hi > 0) { hi--; applySnap(hist[hi]); btns() } }
            function redo() { if (hi < hist.length - 1) { hi++; applySnap(hist[hi]); btns() } }

            /* ---- hotspots / accordion / cart ---- */
            function renderHot() {
                const h = $('#hotspots'); h.innerHTML = ''; const L = LOOKS[S.look];
                GK.forEach(g => {
                    const it = L.p[g]; if (!it.length) return; const d = document.createElement('button'); d.className = 'hs'; d.style.left = HP[g][0] + '%'; d.style.top = HP[g][1] + '%';
                    d.innerHTML = '<em>' + it.map(p => `<u>${p[0]}</u> · ${p[1]} · $${p[2]}`).join('<br>') + '</em>';
                    d.onclick = e => { e.stopPropagation(); goOutfits(); setRow(g, true) }; h.appendChild(d)
                })
            }
            function renderAcc() {
                const L = LOOKS[S.look];
                $('#acc').innerHTML = GK.map(g => {
                    const it = L.p[g], n = it.length;
                    const body = n ? it.map((p, j) => { const id = S.look + '|' + g + '|' + j, on = cart.has(id); return `<div class="it"><span class="in">${p[0]}<small>${p[1]}</small></span><b>$${p[2]}</b><button class="add${on ? ' on' : ''}" data-id="${id}" aria-label="Toggle in cart">${IC(on ? 'check' : 'plus')}</button></div>` }).join('') : '<div class="it none">Nothing in this look</div>';
                    return `<div class="row${openRow === g ? ' open' : ''}" data-g="${g}"><button class="rh"><span>${GN[g]}${n ? `<small> · ${n}</small>` : ''}</span>${IC('chev')}</button><div class="ab"><div>${body}</div></div></div>`
                }).join('')
            }
            function setRow(g, force) { openRow = force ? g : (openRow === g ? null : g); $$('#acc .row').forEach(r => r.classList.toggle('open', r.dataset.g === openRow)) }

                if (cart.has(id)) cart.delete(id);

            /* ---- tune view ---- */

                v.appendChild(bodyH); v.appendChild(bodyB);
                const po = document.createElement('div'); po.innerHTML = '<div class="lab">Posture</div><div class="opts" id="po">' + ['Relaxed', 'Confident', 'Editorial'].map((p, i) => `<button class="opt${i ? '' : ' on'}">${p}</button>`).join('') + '</div><div class="lab">Framing</div><div class="opts" id="fr">' + [['full', 'Full body'], ['mid', 'Mid shot'], ['portrait', 'Portrait']].map(f => `<button class="opt${f[0] === frame ? ' on' : ''}" data-f="${f[0]}">${f[1]}</button>`).join('') + '</div>';
                v.appendChild(po);
                $$('#po .opt').forEach(b => b.onclick = () => { $$('#po .opt').forEach(x => x.classList.toggle('on', x === b)); rescan() });
                $$('#fr .opt').forEach(b => b.onclick = () => setFrame(b.dataset.f))
            }
            function syncBody() { bodyH && bodyH.set(S.height); bodyB && bodyB.set(S.build) }

            /* ---- personality ---- */
            const TRAITS = ['Curious', 'Bold', 'Calm', 'Witty', 'Romantic', 'Driven', 'Playful', 'Gentle', 'Creative', 'Loyal'];
            const AX = ['Openness', 'Energy', 'Warmth', 'Focus', 'Humour'];
            let traits = ['Curious', 'Creative', 'Gentle'], rv = [];
            const hv = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h };
            function calcRadar() { rv = AX.map(a => 30 + (traits.reduce((s, t) => s + hv(t + ':' + a), 0) % 65)) }
            function drawRadar() {
                const cx = 125, cy = 108, R = 78, pt = (i, r) => [cx + r * Math.cos((-90 + 72 * i) * Math.PI / 180), cy + r * Math.sin((-90 + 72 * i) * Math.PI / 180)];
                let s = '';[.25, .5, .75, 1].forEach(f => { s += `<polygon points="${AX.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.25)"/>` });
                AX.forEach((_, i) => { const p = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(255,255,255,.18)"/>` });
                s += `<polygon points="${rv.map((v, i) => pt(i, R * v / 100).join(',')).join(' ')}" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.5"/>`;
                AX.forEach((a, i) => { const p = pt(i, R + 14), c = Math.cos((-90 + 72 * i) * Math.PI / 180); s += `<text x="${p[0]}" y="${p[1] + 4}" fill="#fff" font-size="11" font-family="Figtree,sans-serif" text-anchor="${c > .3 ? 'start' : c < -.3 ? 'end' : 'middle'}">${a}</text>` });
                $('#radar').innerHTML = s
            }
            let persS = [];
            function buildPers() {
                const v = $('#v-pers'); v.innerHTML = '<div class="vh"><h3>Personality</h3><span>pick up to 3</span></div><div class="opts" id="tr"></div><svg id="radar" viewBox="0 0 250 210" width="250" height="210"></svg>';
                const tr = $('#tr'); tr.innerHTML = TRAITS.map(t => `<button class="opt" data-t="${t}">${t}</button>`).join('');
                [0, 1].forEach(i => { const w = mkSlider(AX[i], 0, 100, rv[i], '', x => { rv[i] = x; drawRadar() }); persS[i] = w; v.appendChild(w) });
                const sync = () => { $$('#tr .opt').forEach(b => b.classList.toggle('on', traits.includes(b.dataset.t))) };
                tr.onclick = e => {
                    const b = e.target.closest('.opt'); if (!b) return; const t = b.dataset.t;
                    if (traits.includes(t)) traits = traits.filter(x => x !== t); else { traits.push(t); if (traits.length > 3) traits.shift() }
                    if (!traits.length) traits = [t]; sync(); calcRadar(); drawRadar(); persS.forEach((w, i) => w.set(rv[i]))
                };
                sync(); drawRadar()
            }

            /* ---- story ---- */
            let sIv;
            function bio(tr) {
                const L = LOOKS[S.look], t = tr.map(x => x.toLowerCase());
                return `${$('#pname').textContent.trim()} is ${S.height} cm of ${t[0]} energy from ${IDS[ident].city}. Mornings start with a long walk along the river in her ${L.n.toLowerCase()} look; friends call her ${t[1] || t[0]} and a little ${t[2] || t[0]}. She collects film cameras, keeps a sketchbook of strangers' outfits, and is saving for a studio of her own.`
            }
            function typeStory(tr) { const full = bio(tr || traits), el = $('#stxt'); let i = 0; clearInterval(sIv); el.textContent = ''; sIv = setInterval(() => { i += 2; el.textContent = full.slice(0, i); if (i >= full.length) clearInterval(sIv) }, 22) }
            function rewrite() { const p = [...TRAITS].sort(() => Math.random() - .5).slice(0, 3); typeStory(p) }

            /* ---- dna ---- */
            function buildHelix() {
                const hx = $('#helix'), NS = 'http://www.w3.org/2000/svg', N = 26, mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); hx.appendChild(e); return e };
                const L = [], A = [], B = []; for (let i = 0; i < N; i++)L.push(mk('line', { stroke: '#fff' })); for (let i = 0; i < N; i++) { A.push(mk('circle', { fill: '#fff' })); B.push(mk('circle', { fill: '#fff' })) }
                let t = 0; (function loop() {
                    t += .03; for (let i = 0; i < N; i++) {
                        const ph = i * .42 + t, s = Math.sin(ph), d = (Math.cos(ph) + 1) / 2, x = 12 + i * 11, y1 = 60 + s * 38, y2 = 60 - s * 38;
                        L[i].setAttribute('x1', x); L[i].setAttribute('x2', x); L[i].setAttribute('y1', y1); L[i].setAttribute('y2', y2); L[i].setAttribute('stroke-opacity', .15 + d * .25);
                        A[i].setAttribute('cx', x); A[i].setAttribute('cy', y1); A[i].setAttribute('r', 2 + d * 2.4); A[i].setAttribute('fill-opacity', .4 + d * .6);
                        B[i].setAttribute('cx', x); B[i].setAttribute('cy', y2); B[i].setAttribute('r', 2 + (1 - d) * 2.4); B[i].setAttribute('fill-opacity', .4 + (1 - d) * .6)
                    }
                    requestAnimationFrame(loop)
                })()
            }

            /* ---- identity ---- */
            const LET = 'abcdefghijklmnopqrstuvwxyz'; let scr;
            function shuffleId() {
                rotS += 180; $('#shuf').style.transform = `rotate(${rotS}deg)`;
                ident = (ident + 1) % IDS.length; const d = IDS[ident], n = $('#pname'); clearInterval(scr); let f = 0;
                scr = setInterval(() => {
                    f++; if (f >= 14) { clearInterval(scr); n.textContent = d.name }
                    else n.textContent = [...d.name].map((c, i) => (c === ' ' || c === '-') ? c : (i < d.name.length * f / 14 ? c : LET[Math.random() * 26 | 0])).join('')
                }, 40);
                $('#age').textContent = d.age; $('#city').textContent = d.city + ', KR'; $('#temp').textContent = d.t + '°C';
                $('#dSeed').textContent = 'VL-0' + (400 + ident * 37) + '-KR'; $('#dAge').textContent = d.age
            }
            function toggleEdit() {
                const n = $('#pname');
                if (!editing) { editing = true; n.contentEditable = 'true'; n.classList.add('ed'); n.focus(); const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r) }
                else { editing = false; n.contentEditable = 'false'; n.classList.remove('ed'); n.blur(); toast('Name updated') }
            }

            /* ---- filters ---- */
            function buildDD() { $('#ddl').innerHTML = FIL.map((f, i) => `<button data-i="${i}">${f.n}</button>`).join('') }
            function renderThumbs() {
                const box = $('#thumbs'); box.innerHTML = '';
                for (let k = 0; k < 5; k++) {
                    const g = (winStart + k) % FIL.length, b = document.createElement('button'); b.className = 'th' + (g === S.grade ? ' on' : ''); b.title = FIL[g].n; b.innerHTML = '<span class="fc"></span><i></i>';
                    const fc = b.firstChild; fc.style.filter = FIL[g].f; face(fc, 64); b.lastChild.style.background = FIL[g].t;
                    b.onclick = () => { S.grade = g; applyGrade(); commit() }; box.appendChild(b)
                }
            }
            function nudge() { winStart = (winStart + 1) % FIL.length; renderThumbs(); const b = $('#thumbs'); b.style.transition = 'none'; b.style.transform = 'translateX(-14px)'; void b.offsetWidth; b.style.transition = 'transform .35s'; b.style.transform = 'none' }

            /* ---- library ---- */
            function openLib(f) { $('#lib').classList.toggle('on', f) }
            function renderLib() {
                $('#libN').textContent = saved.filter(s => !s.pending).length + ' saved'; const row = $('#libRow');
                if (!saved.length) { row.innerHTML = '<em>Save a look to start your library.</em>'; return }
                row.innerHTML = ''; saved.forEach((s, i) => {
                    const c = document.createElement('div'); c.className = 'sc' + (s.pending ? ' slot' : '') + (s.pop ? ' pop' : ''); s.pop = false;
                    c.innerHTML = `<div class="im" style="background-image:url('${U360[s.look]}');filter:${FIL[s.grade].f}"></div>`;
                    c.onclick = () => { if (s.pending) return; if (s.look !== S.look) { S.look = s.look; showLook(s.look) } S.grade = s.grade; applyGrade(); commit() }; row.appendChild(c)
                })
            }
            function saveLook() {
                const btn = $('#save button'); btn.classList.remove('shine'); void btn.offsetWidth; btn.classList.add('shine');
                openLib(true); const idx = saved.length, item = { look: S.look, grade: S.grade, pending: true }; saved.push(item); renderLib();
                const slot = $('#libRow').children[idx], from = $('#modelWrap').getBoundingClientRect();
                const fl = document.createElement('div'); fl.className = 'flyer'; fl.style.backgroundImage = `url("${U1000[S.look]}")`; fl.style.filter = FIL[S.grade].f; document.body.appendChild(fl);
                const sx = from.left + from.width * .25, sy = from.top, sw = from.width * .5, sh = from.height, t0 = performance.now(), D = 800;
                const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                (function step(now) {
                    const p = Math.min(1, (now - t0) / D), e = ease(p), to = slot.getBoundingClientRect();
                    fl.style.left = (sx + (to.left - sx) * e) + 'px'; fl.style.top = (sy + (to.top - sy) * e) + 'px'; fl.style.width = (sw + (to.width - sw) * e) + 'px'; fl.style.height = (sh + (to.height - sh) * e) + 'px';
                    if (p < 1) requestAnimationFrame(step)
                })(t0);
                setTimeout(() => { fl.remove(); item.pending = false; item.pop = true; renderLib(); badge('#bdLib', saved.length); toast('Saved to library') }, 860)
            }

            /* ---- randomize ---- */
            async function randomize() {
                if (busy) return; busy = true; rot += 360; $('#rand svg').style.transform = `rotate(${rot}deg)`;
                let cards = $$('.card').filter(c => c.style.display !== 'none'); if (cards.length < 2) cards = $$('.card');
                const cur = cards.findIndex(c => +c.dataset.i === S.look), n = cards.length; let tp; do { tp = Math.floor(Math.random() * n) } while (tp === cur && n > 1);
                const start = ((tp - 11) % n + n) % n;
                for (let k = 0; k < 12; k++) { const c = cards[(start + k) % n]; c.classList.add('roll'); await sleep(50 + k * 8); c.classList.remove('roll') }
                S.look = +cards[tp].dataset.i; S.grade = Math.floor(Math.random() * 4); S.real = 55 + Math.floor(Math.random() * 45);
                applyGrade(); applyReal(); showLook(S.look); commit(); busy = false
            }

            /* ---- tabs / views ---- */
            function showView(n) { $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + n)) }
            function applyView() {
                let v;
                if (tab === 'style') { if (styleKey === 'outfits') v = 'outfits'; else if (styleKey === 'body') v = 'body'; else { v = 'tune'; renderTune(styleKey) } }
                else v = { dna: 'dna', body: 'body', pers: 'pers', story: 'story' }[tab];
                showView(v); if (tab === 'story') typeStory()
            }
            function moveInd() { const b = $('#tabs button.on'), i = $('#tabInd'); if (b) { i.style.left = b.offsetLeft + 'px'; i.style.width = b.offsetWidth + 'px' } const s = $('#side button.on'); if (s) $('#sideInd').style.top = s.offsetTop + 'px' }
            function setTab(t) { tab = t; $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); moveInd(); document.body.classList.toggle('nostyle', t !== 'style'); applyView() }
            function setStyle(k) { styleKey = k; $$('#side button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); moveInd(); if (tab !== 'style') setTab('style'); else applyView() }
            function goOutfits() { if (tab !== 'style' || styleKey !== 'outfits') setStyle('outfits') }

            /* ---- init ---- */
            function fit() { document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900)) }
            fit(); addEventListener('resize', () => { fit(); moveInd() });
            $('#bg').style.backgroundImage = `url("${BG}")`;
            buildChips(); buildGrid(); buildDD(); buildBody(); calcRadar(); buildPers(); buildHelix();
            showLook(0, true); applyGrade(); applyReal(); applyBody(); setFrame('full'); refreshCart(); updateFav(); updateFaces(); btns(); renderLib();
            moveInd(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
            addEventListener('load', moveInd); if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);

            /* ---- events ---- */
            addEventListener('pointermove', e => { const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5, bg = $('#bg'); bg.style.setProperty('--bx', -x * 22 + 'px'); bg.style.setProperty('--by', -y * 12 + 'px'); $('#modelInner').style.setProperty('--mx', x * 10 + 'px') });
            $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t) };
            $('#side').onclick = e => { const b = e.target.closest('button'); if (b) setStyle(b.dataset.k) };
            $('#rand').onclick = randomize;
            $('#chips').onclick = e => { const c = e.target.closest('.chip'); if (c) filterCat(c.dataset.c) };
            $('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) pickLook(+c.dataset.i) };
            $('#grid').ondblclick = e => { const c = e.target.closest('.card'); if (c) toggleFav(+c.dataset.i) };
            $('#acc').onclick = e => { const a = e.target.closest('.add'); if (a) return toggleCart(a.dataset.id); const h = e.target.closest('.rh'); if (h) setRow(h.parentNode.dataset.g) };
            $('#btnCart').onclick = e => { e.stopPropagation(); $('#cartP').classList.toggle('on'); $('#more').classList.remove('on') };
            $('#btnFav').onclick = () => toggleFav(S.look);
            $('#btnLib').onclick = () => openLib(!$('#lib').classList.contains('on'));
            $('#btnMore').onclick = e => { e.stopPropagation(); $('#more').classList.toggle('on') };
            $('#more').onclick = e => { const b = e.target.closest('button'); if (b) { $('#more').classList.remove('on'); toast(b.dataset.m) } };
            $('#addLook').onclick = addWholeLook;
            $('#checkout').onclick = checkout;
            $('#cartL').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { cart.delete(b.dataset.rm); refreshCart() } };
            $('#pen').onclick = toggleEdit;
            $('#pname').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (editing) toggleEdit() } });
            $('#shuf').onclick = shuffleId;
            $('#reseed').onclick = () => { shuffleId(); rescan() };
            $('#rewrite').onclick = rewrite;
            $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
            $('#bPose').onclick = () => setFrame({ full: 'mid', mid: 'portrait', portrait: 'full' }[frame]);
            $('#bReset').onclick = () => { const c = S.look !== DEF.look; Object.assign(S, DEF); if (c) showLook(S.look); applyGrade(); applyReal(); applyBody(); syncBody(); setFrame('full'); updateFav(); commit(); toast('Reset to default') };
            $('#realR').addEventListener('input', e => { S.real = +e.target.value; applyReal() });
            $('#realR').addEventListener('change', () => { rescan(); commit() });
            $('#ddb').onclick = e => { e.stopPropagation(); $('#ddl').classList.toggle('on'); $('#ddb').classList.toggle('open') };
            $('#ddl').onclick = e => { const b = e.target.closest('button'); if (b) { S.grade = +b.dataset.i; applyGrade(); commit() } };
            $('#nxt').onclick = nudge;
            $('#save button').onclick = e => { e.stopPropagation(); saveLook() };
            document.addEventListener('click', e => {
                if (!e.target.closest('#lib,#btnLib,#save')) openLib(false);
                if (!e.target.closest('#more,#btnMore')) $('#more').classList.remove('on');
                if (!e.target.closest('#ddb,#ddl')) { $('#ddl').classList.remove('on'); $('#ddb').classList.remove('open') }
                if (!e.target.closest('#cartP,#btnCart,.add,#acc,.hs')) $('#cartP').classList.remove('on')
            });
            addEventListener('keydown', e => {
                const t = e.target; if (t.isContentEditable) return;
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return }
                if (t.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft') pickLook((S.look + LOOKS.length - 1) % LOOKS.length);
                if (e.key === 'ArrowRight') pickLook((S.look + 1) % LOOKS.length)
            });
        })();
    </script>
</body>

</html>
